[project]
name = "pdf-rag"
version = "0.1.0"
description = "RAG sobre PDFs con ChromaDB, evaluado con RAGAS y con costos en LangSmith"
readme = "README.md"
authors = [
    { name = "Juan Manuel Diaz Moreno", email = "jdiazmoreno271@gmail.com" }
]
requires-python = ">=3.12"
dependencies = [
    "chromadb>=1.5.9",
    "groq>=0.37.1",
    "langchain-community<0.4",
    "langchain-groq>=1.1.3",
    "langchain-huggingface>=1.2.3",
    "langsmith>=0.14.13",
    "pypdf>=6.21.3",
    "python-dotenv>=1.2.4",
    "ragas>=0.4.3",
    "sentence-transformers>=6.2.0",
]

[project.scripts]
pdf-rag = "pdf_rag:main"

[build-system]
requires = ["uv_build>=0.13.6,<0.14.0"]
build-backend = "uv_build"
